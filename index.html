<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>카봇 숫자 맞추기 게임 (1~5)</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Pretendard', 'Malgun Gothic', sans-serif;
        }

        body {
            background-color: #f0f8ff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px 0;
        }

        .game-card {
            position: relative;
            background: white;
            padding: 40px 30px;
            border-radius: 25px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 600px;
            width: 92%;
        }

        /* 🎵 BGM 온/오프 버튼 */
        .bgm-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background-color: #f0f0f0;
            border: none;
            border-radius: 20px;
            padding: 8px 15px;
            font-size: 16px;
            font-weight: bold;
            color: #555;
            cursor: pointer;
            transition: all 0.2s;
        }

        .bgm-btn:hover { background-color: #e0e0e0; }

        h1 {
            color: #333;
            font-size: 32px; 
            margin-top: 10px;
            margin-bottom: 15px;
        }

        .status-bar {
            display: flex;
            justify-content: center;
            font-size: 22px; 
            font-weight: bold;
            color: #555;
            margin-bottom: 25px;
            background-color: #f8f9fa;
            padding: 12px 20px;
            border-radius: 12px;
        }

        .image-container {
            background-color: #ffffff; 
            border: 4px dashed #e0e0e0;
            border-radius: 20px;
            min-height: 320px;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            margin-bottom: 30px;
        }

        .custom-img {
            max-width: 95%;
            max-height: 300px; 
            object-fit: contain;
            animation: popIn 0.3s ease-out;
        }

        @keyframes popIn {
            0% { transform: scale(0.9); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .options-container {
            display: flex;
            justify-content: space-between;
            gap: 15px;
        }

        /* 공통 선택지 버튼 기본 스타일 */
        .option-btn {
            flex: 1;
            padding: 20px 10px;
            font-size: 40px; 
            font-weight: bold;
            color: white;
            border: none;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 🔴 1번 버튼 (빨강) */
        .btn-red {
            background-color: #e63946;
            box-shadow: 0 5px 0 #b8222e;
        }
        .btn-red:hover { background-color: #f04e5b; }

        /* 🟢 2번 버튼 (초록) */
        .btn-green {
            background-color: #2a9d8f;
            box-shadow: 0 5px 0 #1e7066;
        }
        .btn-green:hover { background-color: #38b2a3; }

        /* 🔵 3번 버튼 (선명한 파랑) */
        .btn-blue {
            background-color: #0077b6;
            box-shadow: 0 5px 0 #005f92;
        }
        .btn-blue:hover { background-color: #0096c7; }

        .option-btn:active, .option-btn.active {
            transform: translateY(2px);
            box-shadow: none !important;
        }

        .option-btn:disabled { opacity: 0.6; cursor: default; }

        .message {
            margin-top: 25px;
            font-size: 28px; 
            font-weight: bold;
            min-height: 40px;
        }

        .correct { color: #2ec4b6; }
        .wrong { color: #e71d36; }

        .restart-btn {
            padding: 18px 36px;
            font-size: 24px; 
            font-weight: bold;
            color: white;
            background-color: #2ec4b6;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            margin-top: 20px;
            box-shadow: 0 4px 0 #23968b;
        }

        .restart-btn:hover {
            background-color: #26a69a;
        }
    </style>
</head>
<body>

<!-- 🎵 동일 폴더 내 MP3 오디오 파일 -->
<audio id="bgm" src="carbot_bgm.mp3" loop></audio>

<div class="game-card">
    <button class="bgm-btn" id="bgmToggleBtn" onclick="toggleBgm()">🎵 음악 켜기</button>

    <h1>카봇이 몇 대 있을까요?</h1>
    
    <div class="status-bar">
        <span>문제: <span id="round">1</span> / 10</span>
    </div>

    <div class="image-container" id="imageDisplay"></div>
    <div class="options-container" id="optionsGroup"></div>
    <div class="message" id="message"></div>
</div>

<script>
    const quizData = [
        { src: 'carbot_1_1.png', answer: 1 },
        { src: 'carbot_1_2.png', answer: 1 },
        { src: 'carbot_2_1.png', answer: 2 },
        { src: 'carbot_2_2.png', answer: 2 },
        { src: 'carbot_3_1.png', answer: 3 },
        { src: 'carbot_3_2.png', answer: 3 },
        { src: 'carbot_4_1.png', answer: 4 },
        { src: 'carbot_4_2.png', answer: 4 },
        { src: 'carbot_5_1.png', answer: 5 },
        { src: 'carbot_5_2.png', answer: 5 }
    ];

    const TOTAL_ROUNDS = 10;
    let currentAnswer = 0;
    let currentRound = 1;
    let isAnsweringBlocked = false;
    let bgmStarted = false;

    // 🎵 MP3 오디오 제어
    const bgm = document.getElementById('bgm');
    bgm.volume = 0.3;

    function startBgmOnFirstInteraction() {
        if (!bgmStarted) {
            bgm.play().then(() => {
                bgmStarted = true;
                document.getElementById('bgmToggleBtn').innerText = '🎵 음악 끄기';
            }).catch(e => {
                console.log("오디오 재생 실패:", e);
            });
        }
    }

    function toggleBgm() {
        const btn = document.getElementById('bgmToggleBtn');
        if (bgm.paused) {
            bgm.play();
            bgmStarted = true;
            btn.innerText = '🎵 음악 끄기';
        } else {
            bgm.pause();
            btn.innerText = '🎵 음악 켜기';
        }
    }

    // 🔊 효과음 (Web Audio API)
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playCorrectSound() {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const now = audioCtx.currentTime;
        
        const osc1 = audioCtx.createOscillator();
        const gain1 = audioCtx.createGain();
        osc1.type = 'sine';
        osc1.frequency.setValueAtTime(523.25, now);
        gain1.gain.setValueAtTime(0.3, now);
        gain1.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
        osc1.connect(gain1);
        gain1.connect(audioCtx.destination);
        osc1.start(now);
        osc1.stop(now + 0.3);

        const osc2 = audioCtx.createOscillator();
        const gain2 = audioCtx.createGain();
        osc2.type = 'sine';
        osc2.frequency.setValueAtTime(783.99, now + 0.12);
        gain2.gain.setValueAtTime(0.3, now + 0.12);
        gain2.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
        osc2.connect(gain2);
        gain2.connect(audioCtx.destination);
        osc2.start(now + 0.12);
        osc2.stop(now + 0.5);
    }

    function playWrongSound() {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(220, now);
        osc.frequency.exponentialRampToValueAtTime(130, now + 0.3);
        
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);

        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.3);
    }

    function getRandomInt(min, max) {
        return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function initGame() {
        currentRound = 1;
        generateQuestion();
    }

    function generateQuestion() {
        if (currentRound > TOTAL_ROUNDS) {
            showFinalResult();
            return;
        }

        isAnsweringBlocked = false;
        document.getElementById('round').innerText = currentRound;
        document.getElementById('message').innerText = '';
        
        const imageDisplay = document.getElementById('imageDisplay');
        const optionsGroup = document.getElementById('optionsGroup');
        
        imageDisplay.innerHTML = '';
        optionsGroup.innerHTML = '';

        const selectedQuiz = quizData[Math.floor(Math.random() * quizData.length)];
        currentAnswer = selectedQuiz.answer;

        const img = document.createElement('img');
        img.src = selectedQuiz.src;
        img.alt = '문제 그림';
        img.className = 'custom-img';
        imageDisplay.appendChild(img);

        const choices = new Set([currentAnswer]);
        while (choices.size < 3) {
            choices.add(getRandomInt(1, 5));
        }

        const shuffledChoices = Array.from(choices).sort(() => Math.random() - 0.5);

        const btnStyles = ['btn-red', 'btn-green', 'btn-blue'];

        shuffledChoices.forEach((num, index) => {
            const btn = document.createElement('button');
            btn.className = `option-btn ${btnStyles[index]}`;
            btn.id = `opt-btn-${index}`;
            btn.innerText = num; // [A], [S], [D] 글자 없이 숫자만 표시

            btn.onclick = () => {
                startBgmOnFirstInteraction();
                checkAnswer(num);
            };
            optionsGroup.appendChild(btn);
        });
    }

    function checkAnswer(selectedNum) {
        if (isAnsweringBlocked) return;

        const messageEl = document.getElementById('message');
        
        if (selectedNum === currentAnswer) {
            isAnsweringBlocked = true;
            playCorrectSound();
            messageEl.innerText = '🎉 정답입니다!';
            messageEl.className = 'message correct';
            
            disableButtons();
            currentRound++;
            
            setTimeout(generateQuestion, 1000);
        } else {
            playWrongSound();
            messageEl.innerText = '❌ 다시 세어볼까요?';
            messageEl.className = 'message wrong';
        }
    }

    function disableButtons() {
        const buttons = document.querySelectorAll('.option-btn');
        buttons.forEach(btn => btn.disabled = true);
    }

    function showFinalResult() {
        playCorrectSound();
        const imageDisplay = document.getElementById('imageDisplay');
        const optionsGroup = document.getElementById('optionsGroup');
        const messageEl = document.getElementById('message');

        imageDisplay.innerHTML = '<span style="font-size: 100px;">🏆</span>';
        optionsGroup.innerHTML = '';
        
        messageEl.className = 'message correct';
        messageEl.innerHTML = `
            <div>참 잘했어요! 10문제를 모두 풀었습니다!</div>
            <button class="restart-btn" onclick="initGame()">다시 하기</button>
        `;
    }

    // ⌨️ 키보드 'a', 's', 'd' 매핑 (화면에는 안 보이지만 입력은 가능)
    window.addEventListener('keydown', (e) => {
        const key = e.key.toLowerCase();
        
        let btnIndex = -1;
        if (key === 'a') btnIndex = 0;      // 빨간색 버튼
        else if (key === 's') btnIndex = 1; // 초록색 버튼
        else if (key === 'd') btnIndex = 2; // 파란색 버튼

        if (btnIndex !== -1) {
            startBgmOnFirstInteraction();
            const targetBtn = document.getElementById(`opt-btn-${btnIndex}`);
            if (targetBtn && !targetBtn.disabled) {
                targetBtn.click();
                targetBtn.classList.add('active');
                setTimeout(() => targetBtn.classList.remove('active'), 150);
            }
        }
    });

    initGame();
</script>

</body>
</html>
